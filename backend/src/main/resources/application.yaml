spring:
  application:
    name: calculo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/calculo}
    username: ${DB_USER:calculo}
    password: ${POSTGRES_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  web:
    resources:
      # Static files are served by SpaConfig (with the single-page-app fallback).
      add-mappings: false
  jackson:
    time-zone: Europe/Warsaw
server:
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: lax
        max-age: 30d
management:
  endpoints:
    web:
      exposure:
        include: health
calculo:
  auth:
    # Required: startup fails when blank (see AuthProperties).
    password: ${CALCULO_PASSWORD:}
  bond-account-name: ${CALCULO_BOND_ACCOUNT_NAME:Obligacje}
  prices:
    sync-on-startup: true
    sync-on-import: true
    schedule-enabled: true
    suffix-map:
      PL: WA
