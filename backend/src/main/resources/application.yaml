spring:
  application:
    name: calculo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/calculo}
    username: ${DB_USER:calculo}
    password: ${POSTGRES_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  web:
    resources:
      # Static files are served by SpaConfig (with the single-page-app fallback).
      add-mappings: false
  jackson:
    time-zone: Europe/Warsaw
server:
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: lax
        max-age: 30d
management:
  endpoints:
    web:
      exposure:
        include: health
calculo:
  auth:
    # Required: startup fails when blank (see AuthProperties).
    password: ${CALCULO_PASSWORD:}
  bond-account-name: ${CALCULO_BOND_ACCOUNT_NAME:Obligacje}
  prices:
    sync-on-startup: true
    sync-on-import: true
    schedule-enabled: true
    # Ticker suffix to EODHD exchange code, e.g. "PL=WAR,DE=XETRA,US=" (an empty replacement drops the suffix).
    suffix-map: ${CALCULO_SUFFIX_MAP:PL=WAR,DE=XETRA}
    eodhd-api-key: ${EODHD_API_KEY:}
    # EODHD exchange code to the currency of its closes.
    exchange-currencies: ${CALCULO_EXCHANGE_CURRENCIES:WAR=PLN,XETRA=EUR,US=USD}
    # Requests to EODHD per UTC day (the free plan allows 20).
    daily-call-limit: ${CALCULO_PRICE_CALL_LIMIT:20}
