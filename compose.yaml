services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: calculo
      POSTGRES_USER: calculo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - calculo-db:/var/lib/postgresql/data

volumes:
  calculo-db:
